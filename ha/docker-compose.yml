version: '3.8'

services:
  svc-ups-ha-bridge:
    image: python:3.11-slim
    container_name: svc_ups_ha_bridge
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/usb/hiddev0:/dev/usb/hiddev0
    volumes:
      - ./ha:/app
    working_dir: /app
    environment:
      - MQTT_HOST=192.168.1.100       # IP адрес вашего Home Assistant / Mosquitto
      - MQTT_PORT=1883
      - MQTT_USER=homeassistant
      - MQTT_PASS=your_mqtt_password
      - UPS_DEVICE=/dev/usb/hiddev0
      - POLL_INTERVAL=10
    command: >
      bash -c "pip install --no-cache-dir paho-mqtt && python3 -u mqtt_bridge.py"
